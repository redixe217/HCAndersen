<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Interaktiv SVG</title>
    <script type="text/javascript" src="interactiveSvgStart.js"></script>
  </head>
  <style>
    #landinfo {
      width: 30vw;
      min-width: 400px;
      font-size: 1.5rem;
      border-radius: 20px;
      padding: 20px;
    }
    img {
      max-width: 100%;
      object-fit: contain;
      /* så man er sikker på billedet ikke bliver croppet */
    }

    ::backdrop {
      backdrop-filter: blur(2px);
      /* gør baggrundne bliver sløret når du åbner popover vinduet/boksen */
    }

    /* #kort {
    } */

    /* -----------------keyframe animation popover start----------------- */
    #landinfo {
      width: 30vw;
      min-width: 400px;
      font-size: 1.5rem;
      border-radius: 20px;

      opacity: 0;
      transform: scale(0.9) translateY(20px);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    #landinfo:popover-open {
      animation: popIn 0.35s ease forwards;
    }
    /* -----------------keyframe animation popover slut----------------- */

    #prikker circle:hover {
      fill: #123456;
      cursor: pointer;
    }

    h1,
    h2,
    p {
      font-family: Arial, Helvetica, sans-serif;
      font-style: italic;
    }
  </style>

  <body>
    <section>
      <h1>Tema 11 Team 9 - H. C. Andersen</h1>
      <h2>Tekst om gruppen.</h2>

      <div id="map"></div>
      <article id="landinfo" popover>
        <p id="landtekst"></p>
        <img src="" alt="" id="destinationbillede" />
      </article>
      <!-- de ting der står i article, det er dem vi henter ind i js filen under opgave d. -->
    </section>
  </body>
</html>
