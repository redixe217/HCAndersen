<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Interaktiv SVG & Video</title>
    <script type="text/javascript" src="interactivesvg.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <section>
      <h1>Tag med H. C. Andersen på en tur gennem København</h1>

      <div id="map"></div>
      <article id="landinfo" popover>
        <p id="landtekst"></p>
        <img src="" alt="" id="destinationbillede" />
      </article>
      <video id="bigvideo" controls>
        <source
          src="video/HC Andersen - Gruppe 9 Tema 11B-lang format.mp4"
          type="video/mp4"
        />
      </video>
      <video id="smallvideo" controls>
        <source
          src="video/HC Andersen - Gruppe 9 Tema 11B-kort format.mp4"
          type="video/mp4"
        />
      </video>
    </section>
  </body>
</html>
